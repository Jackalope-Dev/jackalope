[package]
name = "jackalope-desktop"
version = "0.1.0"
description = "Jackalope - Ultra-performant desktop shell and harness for agentic workflows"
authors = ["Jackalope Contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[lib]
name = "jackalope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

toml_edit = { version = "0.25", features = ["serde"] }
toml = "1"
reqwest = { version = "0.13", default-features = false }
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
petgraph = "0.8"
cron = "0.17"
chrono-tz = "0.10"
headless_chrome = "1"
dunce = "1"
oxc_resolver = "11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }
