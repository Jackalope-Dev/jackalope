[package]
name = "jackalope-desktop"
version = "0.1.0"
description = "Jackalope - Ultra-performant desktop shell and harness for agentic workflows"
authors = ["Jackalope Contributors"]
edition = "2021"

[lib]
name = "jackalope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
portable-pty = "0.8"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

toml_edit = { version = "0.25", features = ["serde"] }
toml = "1"
reqwest = { version = "0.13", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
