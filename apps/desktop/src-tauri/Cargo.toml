[package]
name = "jackalope-desktop"
version = "0.1.0"
description = "Jackalope - Ultra-performant desktop shell and harness for agentic workflows"
authors = ["Jackalope Contributors"]
edition = "2021"

[lib]
name = "jackalope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
