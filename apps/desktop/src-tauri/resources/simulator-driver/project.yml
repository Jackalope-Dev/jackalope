# Regenerate JackalopeSimulatorDriver.xcodeproj with `xcodegen generate` in this
# folder after changing targets or settings. Jackalope builds the committed
# project, so xcodegen is never needed at runtime.
name: JackalopeSimulatorDriver
options:
  bundleIdPrefix: digital.jackalope
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: YES
    SUPPORTED_PLATFORMS: iphonesimulator
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.jackalope.SimulatorDriverHost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Driver:
    type: bundle.ui-testing
    platform: iOS
    sources: [Driver]
    dependencies: [{target: Host}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.jackalope.SimulatorDriver
        TEST_TARGET_NAME: Host
schemes:
  Driver:
    build:
      targets:
        Host: all
        Driver: [test]
    test:
      targets: [Driver]
