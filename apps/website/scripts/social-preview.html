<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jackalope social preview</title>
    <!--
      Mirrors the landing page hero in its light theme (Jackalope Violet, atmosphere 18): the
      headline on the left and one line forking into a lane per agent on the right.
      capture-social.mjs supplies the mark and agent logos from @jackalope/brand and calls
      render() before the screenshot.
    -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-weight: 200 800;
        src: url('../../../node_modules/.pnpm/@fontsource-variable+plus-jakarta-sans@5.3.0/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-weight: 100 800;
        src: url('../../../node_modules/.pnpm/@fontsource-variable+jetbrains-mono@5.3.0/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
      }
      :root {
        --color-accent: hsl(258 90% 66%);
        --color-accent-ink: hsl(258 72% 50%);
        --color-bg: hsl(258 8.1% 99%);
        --color-surface: hsl(258 8.1% 100%);
        --color-border: hsl(258 8.1% 82%);
        --color-text-primary: hsl(258 4% 14%);
        --color-text-secondary: hsl(258 4% 32%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Plus Jakarta Sans Variable', sans-serif;
        color: var(--color-text-primary);
        background: var(--color-bg);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 60px;
        bottom: 60px;
        width: 640px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 34px;
        height: 38px;
        fill: var(--color-text-primary);
      }
      h1 {
        margin-top: auto;
        font-size: 88px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      h1 span {
        display: block;
        color: var(--color-accent-ink);
      }
      p {
        margin-top: 28px;
        max-width: 560px;
        font-size: 26px;
        line-height: 1.4;
        color: var(--color-text-secondary);
      }
      .url {
        margin-top: auto;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 20px;
        font-weight: 500;
        color: var(--color-text-secondary);
      }
      #lanes {
        position: absolute;
        right: 0;
        top: 0;
        width: 520px;
        height: 630px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg id="brand-mark" viewBox="38 4 105 117" aria-hidden="true"></svg>
        Jackalope
      </div>
      <h1>Run your agents <span>side by side.</span></h1>
      <p>Every task runs in its own Git worktree, and nothing lands until you approve it.</p>
      <div class="url">jackalope.dev</div>
    </div>
    <svg id="lanes" viewBox="0 0 520 630" aria-hidden="true"></svg>
    <script>
      const SVG = 'http://www.w3.org/2000/svg';
      const create = (name, attributes) => {
        const element = document.createElementNS(SVG, name);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        return element;
      };
      const style = getComputedStyle(document.documentElement);
      const token = (name) => style.getPropertyValue(name).trim();

      // The hero's fork as one still frame: the line starts at a ring, opens into a lane per
      // agent with the same eased curve the page uses, and each agent's mark sits on its lane.
      function drawLanes(svg, agents) {
        const root = { x: 250, y: 64 };
        const forkEnd = 500;
        const spread = 408;
        const ease = (t) => t * t * (3 - 2 * t);
        const laneX = (index, y) => {
          const open = ease(Math.min(1, Math.max(0, (y - root.y) / (forkEnd - root.y))));
          return root.x + (index / (agents.length - 1) - 0.5) * spread * open;
        };
        for (const [index, agent] of agents.entries()) {
          const gradient = create('linearGradient', {
            id: `lane-${index}`,
            gradientUnits: 'userSpaceOnUse',
            x1: 0,
            y1: root.y,
            x2: 0,
            y2: forkEnd,
          });
          gradient.append(
            create('stop', { offset: 0, 'stop-color': token('--color-accent') }),
            create('stop', { offset: 1, 'stop-color': agent.color }),
          );
          svg.append(gradient);
          const points = [];
          for (let y = root.y; y <= 630; y += 6) points.push(`${laneX(index, y).toFixed(1)},${y}`);
          svg.append(
            create('polyline', {
              points: points.join(' '),
              fill: 'none',
              stroke: `url(#lane-${index})`,
              'stroke-width': 3,
              'stroke-linejoin': 'round',
            }),
          );
          const beadY = 150 + ((index * 3) % agents.length) * 42;
          svg.append(create('circle', { cx: laneX(index, beadY), cy: beadY, r: 6, fill: agent.color }));
        }
        svg.append(
          create('circle', {
            cx: root.x,
            cy: root.y,
            r: 9,
            fill: token('--color-bg'),
            stroke: token('--color-accent'),
            'stroke-width': 6,
          }),
        );
        for (const [index, agent] of agents.entries()) {
          const x = laneX(index, forkEnd);
          svg.append(
            create('circle', {
              cx: x,
              cy: forkEnd,
              r: 26,
              fill: token('--color-surface'),
              stroke: token('--color-border'),
            }),
          );
          const icon = create('g', { transform: `translate(${x - 14} ${forkEnd - 14}) scale(${28 / 24})` });
          for (const d of agent.paths) {
            icon.append(create('path', { d, 'fill-rule': 'evenodd', fill: agent.color }));
          }
          svg.append(icon);
        }
      }

      // capture-social.mjs calls this with the brand data before the screenshot.
      window.render = ({ mark, agents }) => {
        const brand = document.getElementById('brand-mark');
        for (const d of mark) brand.append(create('path', { d }));
        drawLanes(document.getElementById('lanes'), agents);
      };
    </script>
  </body>
</html>
