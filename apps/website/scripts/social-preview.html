<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jackalope social preview</title>
    <!--
      Mirrors the landing page hero in its light theme (Electric Indigo, atmosphere 18).
      capture-social.mjs supplies the mark and agent logos from @jackalope/brand and calls
      render() before the screenshot.
    -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-weight: 200 800;
        src: url('../../../node_modules/.pnpm/@fontsource-variable+plus-jakarta-sans@5.3.0/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-weight: 100 800;
        src: url('../../../node_modules/.pnpm/@fontsource-variable+jetbrains-mono@5.3.0/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
      }
      :root {
        --color-accent: hsl(245 88% 64%);
        --color-bg: hsl(245 8.1% 99%);
        --color-shell: hsl(245 11.7% 94%);
        --color-border-subtle: hsl(245 8.1% 90%);
        --color-text-primary: hsl(245 4% 14%);
        --color-text-secondary: hsl(245 4% 32%);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Plus Jakarta Sans Variable', sans-serif;
        color: var(--color-text-primary);
        background:
          radial-gradient(560px 460px at 82% 46%, hsl(245 88% 64% / 0.13), transparent 70%),
          radial-gradient(520px 360px at 0% 100%, hsl(245 88% 64% / 0.07), transparent 70%),
          linear-gradient(145deg, var(--color-bg), var(--color-shell));
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 60px;
        bottom: 60px;
        width: 640px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 34px;
        height: 38px;
        fill: var(--color-text-primary);
      }
      h1 {
        margin-top: auto;
        font-size: 84px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.055em;
      }
      h1 span {
        display: block;
        padding-bottom: 0.14em;
        margin-bottom: -0.08em;
        background: linear-gradient(
          90deg,
          var(--color-text-primary),
          color-mix(in srgb, var(--color-text-primary) 60%, var(--color-bg))
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 24px;
        max-width: 560px;
        font-size: 24px;
        line-height: 1.4;
        color: var(--color-text-secondary);
      }
      .agents {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        margin-top: 30px;
        list-style: none;
        font-size: 19px;
        font-weight: 500;
        color: var(--color-text-secondary);
      }
      .agents li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .agents svg {
        width: 22px;
        height: 22px;
      }
      .url {
        margin-top: auto;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 20px;
        font-weight: 500;
        color: var(--color-text-secondary);
      }
      #mark {
        position: absolute;
        right: 40px;
        top: 55px;
        width: 440px;
        height: 520px;
        color: var(--color-text-primary);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <svg id="brand-mark" viewBox="38 4 105 117" aria-hidden="true"></svg>
        Jackalope
      </div>
      <h1><span>Run your agents</span><span>side by side.</span></h1>
      <p>Every task runs in its own Git worktree, and nothing lands until you approve it.</p>
      <ul class="agents" id="agents"></ul>
      <div class="url">jackalope.dev</div>
    </div>
    <canvas id="mark"></canvas>
    <script>
      const SVG = 'http://www.w3.org/2000/svg';
      const RAMP = ' .:-=+*#%@';
      const VIEW = { x: 38, y: 4, width: 105, height: 117 };
      const ECHO = { x: 4, y: 1 };

      // The landing page's AsciiMark as one still frame: a solid head with outlined
      // echoes trailing right, read back from a one-pixel-per-cell raster.
      function drawMark(canvas, mark, echoes) {
        const box = canvas.getBoundingClientRect();
        const ratio = 2;
        canvas.width = box.width * ratio;
        canvas.height = box.height * ratio;
        const context = canvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const size = 11;
        const cellWidth = size * 0.62;
        const cellHeight = size * 1.05;
        const cols = Math.floor(box.width / cellWidth);
        const rows = Math.floor(box.height / cellHeight);
        const sampler = document.createElement('canvas').getContext('2d');
        sampler.canvas.width = cols;
        sampler.canvas.height = rows;
        const paths = mark.map((d) => new Path2D(d));
        const spanX = VIEW.width + ECHO.x * echoes;
        const spanY = VIEW.height + ECHO.y * echoes;
        const scale = Math.min(box.width / spanX, box.height / spanY) * 0.94;
        const offsetX = (box.width - spanX * scale) / 2;
        const offsetY = (box.height - spanY * scale) / 2;
        const place = (shift) =>
          sampler.setTransform(
            scale / cellWidth,
            0,
            0,
            scale / cellHeight,
            (offsetX + (ECHO.x * shift - VIEW.x) * scale) / cellWidth,
            (offsetY + (ECHO.y * shift - VIEW.y) * scale) / cellHeight,
          );
        sampler.lineWidth = 1.6;
        for (let echo = echoes; echo >= 1; echo--) {
          place(echo);
          sampler.strokeStyle = `rgba(0,0,0,${0.55 - (echo / echoes) * 0.4})`;
          for (const path of paths) sampler.stroke(path);
        }
        place(0);
        sampler.fillStyle = '#000';
        for (const path of paths) sampler.fill(path);
        const data = sampler.getImageData(0, 0, cols, rows).data;
        const style = getComputedStyle(canvas);
        const ink = style.color;
        const accent = style.getPropertyValue('--color-accent').trim();
        context.font = `500 ${size}px "JetBrains Mono Variable", monospace`;
        context.textBaseline = 'top';
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const level = data[(row * cols + col) * 4 + 3] / 255;
            if (level < 0.06) continue;
            const glyph = RAMP[Math.min(RAMP.length - 1, Math.ceil(level * (RAMP.length - 1)))];
            context.globalAlpha = 0.22 + level * 0.78;
            // A sparse, fixed scatter of accent glyphs, as the hero's shimmer shows.
            context.fillStyle = (row * 31 + col * 17) % 23 === 0 ? accent : ink;
            context.fillText(glyph, col * cellWidth, row * cellHeight);
          }
        }
      }

      // capture-social.mjs calls this with the brand data before the screenshot.
      window.render = ({ mark, agents }) => {
        const brand = document.getElementById('brand-mark');
        for (const d of mark) {
          const path = document.createElementNS(SVG, 'path');
          path.setAttribute('d', d);
          brand.append(path);
        }
        const list = document.getElementById('agents');
        for (const agent of agents) {
          const item = document.createElement('li');
          const icon = document.createElementNS(SVG, 'svg');
          icon.setAttribute('viewBox', '0 0 24 24');
          icon.setAttribute('aria-hidden', 'true');
          for (const d of agent.paths) {
            const path = document.createElementNS(SVG, 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill-rule', 'evenodd');
            path.setAttribute('fill', agent.color || 'currentColor');
            icon.append(path);
          }
          item.append(icon, agent.name);
          list.append(item);
        }
        drawMark(document.getElementById('mark'), mark, 6);
      };
    </script>
  </body>
</html>
