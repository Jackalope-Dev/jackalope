name: Launch infrastructure check
on:
  push:
    branches: [master]
    paths: ['scripts/release/**', '.github/workflows/launch-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-preflight
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'Jackalope-Dev/jackalope' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test scripts/release/preflight.test.mjs
      - name: Verify API readiness and release bucket permissions
        run: node scripts/release/preflight.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Validate website hook configuration without triggering a build
        if: always()
        run: node scripts/release/website-refresh.mjs check
        env:
          CLOUDFLARE_WEBSITE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WEBSITE_DEPLOY_HOOK }}
      - name: Verify public website
        if: always()
        run: node apps/website/scripts/verify-deployment.mjs https://jackalope.dev
