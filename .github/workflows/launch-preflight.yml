name: Launch infrastructure check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launch-preflight
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'Jackalope-Dev/jackalope' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
      - name: Verify public API readiness
        run: node scripts/release/preflight.mjs
      - name: Verify public website
        if: always()
        run: node apps/website/scripts/verify-deployment.mjs https://jackalope.dev
