name: Verify platforms
on:
  pull_request:
  merge_group:
  push:
    branches: [master, main, beta, stable]
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request or to master cancels the older run; only the newest
# master commit matters and releases verify their own commit. Release branches, merge
# groups and manual runs get their own group and always run to completion.
concurrency:
  group: verify-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
  # Decides once which suites a pull request or merge group can affect; pushes and
  # manual runs always run everything. The merge queue squashes, so a merge group's
  # HEAD^1 is the queue entry before it and the diff is that pull request alone.
  # If this job fails, its outputs are empty and the platform jobs run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      lock: ${{ steps.scope.outputs.lock }}
      # Release branches, pull requests into them and manual runs also build trial
      # packages and run Intel macOS.
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 2 || 1 }}
      # The Rust cache key is the lockfile the build starts from (the base
      # branch's for a pull request or merge group), so a pull request restores
      # master's cache exactly instead of uploading its own copy, and master uploads
      # only when its lockfile changes. Cargo still rebuilds whatever the change touched.
      - name: Decide which suites the change affects
        id: scope
        run: |
          node scripts/change-scope.mjs ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'HEAD^1' || '' }}
          echo "release=${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable' || github.base_ref == 'beta' || github.base_ref == 'stable' }}" >> "$GITHUB_OUTPUT"
          echo "lock=$(git rev-parse ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'HEAD^1' || 'HEAD' }}:apps/desktop/src-tauri/Cargo.lock)" >> "$GITHUB_OUTPUT"
  verify:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: '2'
      # Each run builds from a clean checkout, so incremental data only enlarges the cache.
      CARGO_INCREMENTAL: '0'
      # Test the configuration Windows ships when it is distributed through the Store.
      JACKALOPE_VERIFY_FEATURES: ${{ vars.RELEASE_DISTRIBUTION == 'store' && 'store' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
        if: needs.changes.outputs.desktop != 'false'
      - run: rustup override set 1.98.1
        if: needs.changes.outputs.desktop != 'false'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: rust-cache
        if: needs.changes.outputs.desktop != 'false'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-windows-1.98.1-${{ needs.changes.outputs.lock }}
          restore-keys: rust-windows-1.98.1-
      - run: pnpm verify
        if: needs.changes.outputs.desktop != 'false'
      - run: pnpm verify --shared-only
        if: needs.changes.outputs.desktop == 'false'
      - run: pnpm tauri build --bundles nsis
        if: needs.changes.outputs.desktop != 'false' && needs.changes.outputs.release != 'false' && vars.RELEASE_DISTRIBUTION != 'store'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: needs.changes.outputs.desktop != 'false' && needs.changes.outputs.release != 'false' && vars.RELEASE_DISTRIBUTION != 'store'
        with:
          name: windows-trial-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Keep only dependency builds in the Rust cache
        if: needs.changes.outputs.desktop != 'false' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target
          rm -rf release/bundle
          for profile in debug release; do
            if [ -d "$profile" ]; then find "$profile" -maxdepth 2 -name '*jackalope*' -prune -exec rm -rf {} +; fi
          done
  unix:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15, macos-15-intel]
    needs: changes
    if: ${{ !cancelled() }}
    # When the change cannot affect the desktop suites, each platform's check
    # still reports, but from a quick Linux job instead of waiting for a macOS
    # runner. Skipping a matrix job at job level would not report the
    # per-platform check names that branch protection requires.
    # Intel macOS runs only for release branches and manual runs; its check still
    # reports from the quick job otherwise. Trial packages are built on the same runs.
    runs-on: ${{ (needs.changes.outputs.desktop == 'false' || (matrix.os == 'macos-15-intel' && needs.changes.outputs.release == 'false')) && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 60
    env:
      SUITES: ${{ (needs.changes.outputs.desktop == 'false' || (matrix.os == 'macos-15-intel' && needs.changes.outputs.release == 'false')) && 'skip' || 'run' }}
      TRIAL: ${{ needs.changes.outputs.release != 'false' && 'build' || 'skip' }}
      RUST_TEST_THREADS: '2'
      # Each run builds from a clean checkout, so incremental data only enlarges the cache.
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Note skipped desktop suites
        if: env.SUITES == 'skip'
        run: echo "Nothing in this change is read by the desktop app, or ${{ matrix.os }} runs only for release branches; its suites are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.SUITES == 'run'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: env.SUITES == 'run'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: env.SUITES == 'run'
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Install Linux native dependencies
        if: env.SUITES == 'run' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf gnome-keyring at-spi2-core libatspi2.0-dev libjson-glib-dev libxi-dev libxtst-dev libxcomposite-dev python3-gi gir1.2-atspi-2.0 xvfb openbox xcompmgr xdotool
      - run: pnpm install --frozen-lockfile
        if: env.SUITES == 'run'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
        if: env.SUITES == 'run'
      - run: rustup override set 1.98.1
        if: env.SUITES == 'run'
      # Keyed by the lockfile the build starts from (the base branch's for a pull
      # request), so a pull request restores master's cache exactly instead of
      # uploading its own copy, and master uploads only when its lockfile changes.
      # Cargo still rebuilds whatever the change touched.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: rust-cache
        if: env.SUITES == 'run'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: rust-${{ matrix.os }}-${{ runner.arch }}-1.98.1-${{ needs.changes.outputs.lock }}
          restore-keys: rust-${{ matrix.os }}-${{ runner.arch }}-1.98.1-
      - run: pnpm verify --native-only
        if: env.SUITES == 'run'
      # A runner's first Chrome launch can spend over 30 s building caches, past the product's startup bound.
      - name: Warm the installed browser
        if: env.SUITES == 'run' && runner.os == 'Linux'
        run: timeout 120 google-chrome --headless=new --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null || true
      - name: Exercise bundled browser
        if: env.SUITES == 'run'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --no-default-features real_agent_browser_ -- --ignored --test-threads=1
      - name: Exercise isolated Linux credential storage
        if: env.SUITES == 'run' && runner.os == 'Linux'
        run: bash scripts/verification/linux-keyring.sh
      - name: Exercise isolated X11 desktop control
        if: env.SUITES == 'run' && runner.os == 'Linux'
        run: bash scripts/verification/linux-desktop-control.sh
      - name: Exercise isolated GNOME Wayland desktop control
        if: env.SUITES == 'run' && matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y --no-install-recommends gnome-shell gnome-session-bin gjs
          bash scripts/verification/linux-wayland-control.sh
      - name: Check macOS desktop helper guards without granting access
        if: env.SUITES == 'run' && runner.os == 'macOS'
        env:
          JACKALOPE_DESKTOP_REQUEST: '{"action":"self_test"}'
        run: apps/desktop/src-tauri/resources/desktop-control/jackalope-desktop-control
      - name: Build macOS trial bundle
        if: env.SUITES == 'run' && env.TRIAL == 'build' && runner.os == 'macOS'
        run: pnpm tauri build --bundles app
      - name: Ad-hoc sign macOS trial for local permission checks
        if: env.SUITES == 'run' && env.TRIAL == 'build' && runner.os == 'macOS'
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle/macos/Jackalope.app
          codesign --force --sign - "$bundle/Contents/Resources/resources/agent-browser/agent-browser"
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
      - name: Build Linux trial package
        if: env.SUITES == 'run' && env.TRIAL == 'build' && runner.os == 'Linux'
        run: pnpm tauri build --bundles deb
      - name: Preserve macOS executable permissions
        if: env.SUITES == 'run' && env.TRIAL == 'build' && runner.os == 'macOS'
        run: tar -czf apps/desktop/src-tauri/target/release/bundle/macos-trial.tar.gz -C apps/desktop/src-tauri/target/release/bundle/macos Jackalope.app
      - name: Preserve trial packages
        if: env.SUITES == 'run' && env.TRIAL == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trial-${{ matrix.os }}-${{ runner.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Keep only dependency builds in the Rust cache
        if: env.SUITES == 'run' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target
          rm -rf release/bundle
          for profile in debug release; do
            if [ -d "$profile" ]; then find "$profile" -maxdepth 2 -name '*jackalope*' -prune -exec rm -rf {} +; fi
          done
  secrets:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: node scripts/check-secrets.mjs
