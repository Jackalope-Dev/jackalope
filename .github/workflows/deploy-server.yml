name: Deploy server
on:
  push:
    branches: [master, beta]
    paths: ['apps/server/**', 'packages/brand/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/release/**', '.github/workflows/deploy-server.yml']
  pull_request:
    paths: ['apps/server/**', 'packages/brand/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/release/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm --filter @jackalope/server types
      - run: pnpm --filter @jackalope/server typecheck
      - run: pnpm --filter @jackalope/server test
      - run: pnpm --filter @jackalope/server build
  deploy:
    needs: verify
    if: github.repository == 'Jackalope-Dev/jackalope' && ((github.ref == 'refs/heads/master' && inputs.environment == 'production') || (github.ref == 'refs/heads/beta' && inputs.environment != 'production')) && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_D1_ID: ${{ inputs.environment == 'production' && vars.SERVER_PRODUCTION_D1_ID || vars.SERVER_STAGING_D1_ID }}
      UPDATE_BASE_URL: ${{ inputs.environment == 'production' && 'https://api.jackalope.dev' || 'https://staging-api.jackalope.dev' }}
      STAGING_ADMIN_EMAIL: ${{ vars.STAGING_ADMIN_EMAIL }}
      STAGING_ACCESS_ISSUER: ${{ vars.STAGING_ACCESS_ISSUER }}
      STAGING_ACCESS_AUD: ${{ vars.STAGING_ACCESS_AUD }}
      STAGING_INGESTION_ENABLED: ${{ vars.STAGING_INGESTION_ENABLED }}
      STAGING_FEEDBACK_EMAIL_ENABLED: ${{ vars.STAGING_FEEDBACK_EMAIL_ENABLED }}
      STAGING_FEEDBACK_EMAIL_FROM: ${{ vars.STAGING_FEEDBACK_EMAIL_FROM }}
      STAGING_FEEDBACK_EMAIL_TO: ${{ vars.STAGING_FEEDBACK_EMAIL_TO }}
      PRODUCTION_ADMIN_EMAIL: ${{ vars.PRODUCTION_ADMIN_EMAIL }}
      PRODUCTION_ACCESS_ISSUER: ${{ vars.PRODUCTION_ACCESS_ISSUER }}
      PRODUCTION_ACCESS_AUD: ${{ vars.PRODUCTION_ACCESS_AUD }}
      PRODUCTION_INGESTION_ENABLED: ${{ vars.PRODUCTION_INGESTION_ENABLED }}
      PRODUCTION_FEEDBACK_EMAIL_ENABLED: ${{ vars.PRODUCTION_FEEDBACK_EMAIL_ENABLED }}
      PRODUCTION_FEEDBACK_EMAIL_FROM: ${{ vars.PRODUCTION_FEEDBACK_EMAIL_FROM }}
      PRODUCTION_FEEDBACK_EMAIL_TO: ${{ vars.PRODUCTION_FEEDBACK_EMAIL_TO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/cloudflare.mjs prepare
      - run: pnpm --filter @jackalope/server exec wrangler deploy --env "$DEPLOY_ENV" --config .wrangler/release/wrangler.json --dry-run
      - run: pnpm --filter @jackalope/server exec wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV" --config .wrangler/release/wrangler.json
      - run: pnpm --filter @jackalope/server exec wrangler deploy --env "$DEPLOY_ENV" --config .wrangler/release/wrangler.json
      - run: node scripts/release/cloudflare.mjs verify
