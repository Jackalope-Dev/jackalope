name: Security checks
on:
  pull_request:
  merge_group:
  push:
    branches: [master, main, beta, stable]
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels its older run. Every other event, including
# each push to master, gets its own group and always runs to completion.
concurrency:
  group: security-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 2 || 1 }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          cache: pnpm
      # A pull request or merge group that changes no manifest, lockfile or audit
      # input passes without auditing, so an advisory published against master does
      # not block unrelated pull requests such as blog posts. The merge queue
      # squashes, so a merge group's HEAD^1 is the entry before it. Pushes, the
      # weekly schedule and manual runs always audit.
      - name: Decide whether the change can affect the audit
        id: scope
        run: node scripts/change-scope.mjs ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'HEAD^1' || '' }}
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.dependencies != 'false'
      - run: rustup toolchain install 1.98.1 --profile minimal
        if: steps.scope.outputs.dependencies != 'false'
      - run: rustup override set 1.98.1
        if: steps.scope.outputs.dependencies != 'false'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.scope.outputs.dependencies != 'false'
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: audit-ubuntu-22.04-x64-rust-1.98.1-0.22.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
        if: steps.scope.outputs.dependencies != 'false' && steps.audit-cache.outputs.cache-hit != 'true'
      - run: pnpm check:dependencies
        if: steps.scope.outputs.dependencies != 'false'
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
        if: steps.scope.outputs.dependencies != 'false'
      - run: cargo test --manifest-path patches/glib/Cargo.toml --release --lib variant_iter
        if: steps.scope.outputs.dependencies != 'false'
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
