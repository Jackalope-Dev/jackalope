name: Security checks
on:
  pull_request:
  push:
    branches: [master, main, beta, stable]
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: audit-ubuntu-22.04-x64-rust-1.98.1-0.22.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
        if: steps.audit-cache.outputs.cache-hit != 'true'
      - run: pnpm check:dependencies
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - run: cargo test --manifest-path patches/glib/Cargo.toml --release --lib variant_iter
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
