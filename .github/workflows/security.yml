name: Security checks
on:
  pull_request:
  push:
    branches: [master, beta]
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm check:dependencies
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - run: cargo test --manifest-path patches/glib/Cargo.toml --release --lib variant_iter
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
