name: Publish reviewed desktop release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful candidate run ID from Desktop release
        type: string
        required: true
      version:
        description: Reviewed version (major.minor.patch)
        type: string
        required: true
      channel:
        type: choice
        options: [beta, stable]
        default: beta
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: cloudflare-${{ inputs.channel == 'stable' && 'production' || 'staging' }}
  cancel-in-progress: false
jobs:
  publish:
    environment: cloud-${{ inputs.channel }}
    if: github.repository == 'Jackalope-Dev/jackalope' && github.ref == 'refs/heads/master' && vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN: ${{ inputs.run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      DEPLOY_ENV: ${{ inputs.channel == 'stable' && 'production' || 'staging' }}
      UPDATE_BASE_URL: ${{ inputs.channel == 'stable' && 'https://api.jackalope.dev' || 'https://staging-api.jackalope.dev' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify reviewed candidate provenance
        id: candidate
        shell: pwsh
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^\d+$' -or $env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid candidate inputs' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:CANDIDATE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedBranch = if ($env:RELEASE_CHANNEL -eq 'beta') { 'beta' } else { 'master' }
          if ($run.conclusion -ne 'success' -or $run.head_branch -ne $expectedBranch -or $run.event -ne 'workflow_dispatch' -or $run.path -ne '.github/workflows/desktop-release.yml' -or $run.repository.full_name -ne $env:GH_REPO) { throw 'Expected a successful manually built candidate from the matching release branch in this repository' }
          "source=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "EXPECTED_SOURCE=$($run.head_sha)" >> $env:GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-${{ inputs.channel }}-${{ inputs.version }}
          path: output/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - shell: pwsh
        run: |
          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[a-f0-9]{32}$') { throw 'Configure the R2 publication account ID.' }
          $receipt = Get-Content output/release/receipt.json -Raw | ConvertFrom-Json
          if (!$receipt.publicSigned -or $receipt.source -ne $env:EXPECTED_SOURCE -or $receipt.version -ne $env:RELEASE_VERSION -or $receipt.channel -ne $env:RELEASE_CHANNEL) { throw 'Candidate receipt mismatch' }
          foreach ($installer in (Get-ChildItem output/release -File | Where-Object Extension -in '.exe','.msi')) {
            if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Installer publisher signature is invalid' }
          }
      - run: node --test scripts/release/*.test.mjs
      - run: node scripts/release/website-refresh.mjs check
        if: inputs.channel == 'stable'
        env:
          CLOUDFLARE_WEBSITE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WEBSITE_DEPLOY_HOOK }}
      - run: node scripts/release/cloudflare.mjs verify
      - shell: pwsh
        run: |
          $tag = "$env:RELEASE_CHANNEL-v$env:RELEASE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:EXPECTED_SOURCE --title "Jackalope $env:RELEASE_VERSION ($env:RELEASE_CHANNEL)" --notes-file output/release/notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $reference = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $reference.object.type -ne 'commit' -or $reference.object.sha -ne $env:EXPECTED_SOURCE) { throw 'Existing release tag does not match the reviewed candidate source' }
          }
      - run: node scripts/release/publish.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - shell: pwsh
        run: |
          $tag = "$env:RELEASE_CHANNEL-v$env:RELEASE_VERSION"
          $assets = Get-ChildItem output/release -File | Where-Object { $_.Extension -in '.exe','.msi','.sig' -or $_.Name -in 'checksums.json','receipt.json' }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prerelease = if ($env:RELEASE_CHANNEL -eq 'beta') { 'true' } else { 'false' }
          gh release edit $tag --draft=false "--prerelease=$prerelease" --notes-file output/release/notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  website:
    environment: cloud-stable
    if: inputs.channel == 'stable'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: website-refs/heads/master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: node scripts/release/website-refresh.mjs
        env:
          CLOUDFLARE_WEBSITE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WEBSITE_DEPLOY_HOOK }}
      - run: node apps/website/scripts/verify-deployment.mjs https://jackalope.dev
