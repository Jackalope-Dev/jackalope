name: Store release
on:
  push:
    branches: [master, beta]
    paths: ['releases/**', 'package.json']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [rehearsal, candidate, submission]
        default: rehearsal
        required: true
permissions:
  contents: read
concurrency:
  group: store-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'Jackalope-Dev/jackalope'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      mode: ${{ steps.plan.outputs.mode }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_AUTOMATION_ENABLED: ${{ vars.STORE_AUTOMATION_ENABLED }}
          STORE_SUBMISSION_ENABLED: ${{ vars.STORE_SUBMISSION_ENABLED }}
          STORE_ACCEPTED: ${{ vars.STORE_ACCEPTED }}
          STORE_BETA_TEST_ENABLED: ${{ vars.STORE_BETA_TEST_ENABLED }}
        run: node scripts/release/store-plan.mjs
  package:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_TEST_THREADS: '2'
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_WEBVIEW2_URL: ${{ vars.STORE_WEBVIEW2_URL }}
      STORE_WEBVIEW2_SHA256: ${{ vars.STORE_WEBVIEW2_SHA256 }}
      RELEASE_MODE: ${{ needs.plan.outputs.mode == 'rehearsal' && 'rehearsal' || 'submission' }}
      RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup override set 1.98.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: store-${{ github.ref_name }}-windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            store-${{ github.ref_name }}-windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
      - run: pnpm verify
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --no-default-features --features store
      - if: env.RELEASE_MODE == 'submission'
        shell: pwsh
        run: ./scripts/release/store-runtime.ps1
      - id: package
        shell: pwsh
        run: ./scripts/release/store.ps1 -Mode $env:RELEASE_MODE -Channel $env:RELEASE_CHANNEL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.package.outcome == 'success'
        with:
          name: store-${{ env.RELEASE_CHANNEL }}-${{ needs.plan.outputs.mode }}
          path: |
            output/store/**/*.msix
            output/store/**/receipt.json
            output/store/**/upload.zip
            output/store/**/submission.json
          if-no-files-found: error
          retention-days: 30
  submit:
    needs: [plan, package]
    if: needs.plan.outputs.mode == 'submission'
    runs-on: windows-latest
    timeout-minutes: 40
    environment: ${{ needs.plan.outputs.channel == 'stable' && 'store-stable' || 'store-beta' }}
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: store-${{ needs.plan.outputs.channel }}-submission
          path: output/store-candidate
      - name: Submit verified package to Microsoft Store
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.sha }}
          EXPECTED_CHANNEL: ${{ needs.plan.outputs.channel }}
          STORE_AUTOMATION_ENABLED: ${{ vars.STORE_AUTOMATION_ENABLED }}
          STORE_SUBMISSION_ENABLED: ${{ vars.STORE_SUBMISSION_ENABLED }}
          STORE_ACCEPTED: ${{ vars.STORE_ACCEPTED }}
          STORE_BETA_TEST_ENABLED: ${{ vars.STORE_BETA_TEST_ENABLED }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_BETA_FLIGHT_ID: ${{ vars.STORE_BETA_FLIGHT_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $receipts = @(Get-ChildItem output/store-candidate -Recurse -Filter receipt.json)
          if ($receipts.Count -ne 1) { throw 'Expected exactly one Store candidate.' }
          node scripts/release/store-submit.mjs $receipts[0].DirectoryName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-${{ needs.plan.outputs.channel }}-submission-result
          path: output/store-candidate/**/submission.json
          if-no-files-found: ignore
          retention-days: 30
