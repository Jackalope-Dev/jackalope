name: Store release
on:
  push:
    tags: ['store-beta/v*', 'store-stable/v*']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [rehearsal, submission]
        default: rehearsal
        required: true
      channel:
        type: choice
        options: [beta, stable]
        default: beta
        required: true
permissions:
  contents: read
concurrency:
  group: store-release
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || vars.STORE_AUTOMATION_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: ${{ (inputs.channel == 'stable' || startsWith(github.ref_name, 'store-stable/')) && 'store-stable' || 'store-beta' }}
    env:
      RUST_TEST_THREADS: '2'
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_WEBVIEW2_URL: ${{ vars.STORE_WEBVIEW2_URL }}
      STORE_WEBVIEW2_SHA256: ${{ vars.STORE_WEBVIEW2_SHA256 }}
      RELEASE_MODE: ${{ github.event_name == 'push' && 'submission' || inputs.mode }}
      RELEASE_CHANNEL: ${{ (inputs.channel == 'stable' || startsWith(github.ref_name, 'store-stable/')) && 'stable' || 'beta' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Check release configuration
        shell: pwsh
        env:
          STORE_AUTOMATION_ENABLED: ${{ vars.STORE_AUTOMATION_ENABLED }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "store-$env:RELEASE_CHANNEL/v$version") { throw 'Release tag must match the app version.' }
          if ($env:RELEASE_MODE -eq 'submission' -and $env:STORE_AUTOMATION_ENABLED -ne 'true') { throw 'Complete Store setup and enable STORE_AUTOMATION_ENABLED first.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup override set 1.98.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: store-windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            store-windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
      - run: pnpm verify
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --no-default-features --features store execution_access
      - if: env.RELEASE_MODE == 'submission'
        shell: pwsh
        run: ./scripts/release/store-runtime.ps1
      - id: package
        shell: pwsh
        run: ./scripts/release/store.ps1 -Mode $env:RELEASE_MODE -Channel $env:RELEASE_CHANNEL
      - name: Submit to Microsoft Store
        if: env.RELEASE_MODE == 'submission'
        shell: pwsh
        env:
          STORE_PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_BETA_FLIGHT_ID: ${{ vars.STORE_BETA_FLIGHT_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node scripts/release/store-submit.mjs $env:STORE_PACKAGE_DIRECTORY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.package.outcome == 'success'
        with:
          name: store-${{ env.RELEASE_CHANNEL }}-${{ env.RELEASE_MODE }}
          path: |
            output/store/**/*.msix
            output/store/**/receipt.json
            output/store/**/submission.json
          if-no-files-found: error
          retention-days: 14
