version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@pierre/diffs'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm-minor-patch:
        patterns: ['*']
        # build.rs pins the bundled agent-browser binary, so its bump needs a code
        # change and fails CI alone instead of holding back the whole group.
        exclude-patterns: [agent-browser]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: keyring
        update-types: [version-update:semver-major]
    groups:
      windows-bindings:
        patterns: [windows, windows-collections, windows-future]
      rust-patches:
        patterns: ['*']
        exclude-patterns: [windows, windows-collections, windows-future]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
