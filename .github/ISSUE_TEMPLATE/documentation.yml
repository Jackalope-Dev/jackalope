name: Documentation issue
description: Report an incorrect, unclear or missing guide
labels: [documentation, needs triage]
body:
  - type: input
    id: location
    attributes:
      label: Page URL or file path
      description: For missing documentation, say where you expected to find it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Describe what is incorrect, unclear or missing and the task you were trying to complete.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. Include supporting references if you have them.
